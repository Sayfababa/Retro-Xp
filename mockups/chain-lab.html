<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090707">
<title>Zauberketten-Labor</title>
<style>
:root{--bg:#090707;--gold:#A88446;--ice:#38BDF8;--frost:#D9F4FF;--text:#C8B99A;--blood:#8A0303;
  --serif:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif;--pix:"Courier New",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;width:100vw;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--serif);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;gap:6px;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px);
  background:radial-gradient(ellipse at 50% 30%,#1d1512 0%,#0d0a09 55%,#050404 100%)}
.panel{background:linear-gradient(180deg,#1f1915,#120e0c);border:2px solid #050403;border-radius:3px;position:relative;
  box-shadow:inset 0 0 0 1px #4a3d2f,inset 0 0 0 3px #0b0807,inset 0 0 0 4px #2a221b,0 3px 8px #000a}
.panel::before,.panel::after{content:"";position:absolute;width:6px;height:6px;top:3px;left:3px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#d8b56c,#6b5226 60%,#1a1209);box-shadow:0 0 0 1px #000}
.panel::after{left:auto;right:3px}
#hud{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;flex:none}
.hp{padding:7px 9px 6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.name{font-size:11px;font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #000}
#h0 .name{color:var(--frost)} #h1 .name{color:#e8a08a}
.bar{height:9px;background:#070505;border:1px solid #000;box-shadow:0 0 0 1px #3a2f25;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .35s}
#h0 .bar i{background:repeating-linear-gradient(90deg,#1b6fa8 0 3px,#2384c4 3px 4px)}
#h1 .bar i{background:repeating-linear-gradient(90deg,#7a0303 0 3px,#930606 3px 4px)}
.hpnum{font-family:var(--pix);font-size:11px;font-weight:700;display:flex;justify-content:space-between;gap:4px}
.st{font-size:9px;padding:0 3px;border:1px solid;display:none}
.st.on{display:inline-block}
#h0 .st{color:#ffd27a;border-color:#a88446;background:#3a2a10}
#h1 .st{color:var(--frost);border-color:var(--ice);background:#0e3550}
#mid{padding:6px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:10px;letter-spacing:.18em;color:var(--gold)}
#mid b{font-size:15px;color:var(--frost);letter-spacing:.05em}
#stage{position:relative;flex:0 0 31%;min-height:150px}
#cv{position:absolute;inset:0;width:100%;height:100%}
#chainMsg{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:94%;text-align:center;padding:5px 10px;
  font-size:12px;letter-spacing:.04em;color:#ffe2a0;background:#1a0f05e8;border:1px solid var(--gold);opacity:0;transition:opacity .3s;pointer-events:none}
#chainMsg.on{opacity:1}
#spells{display:flex;flex-direction:column;gap:5px;padding:9px 10px 8px;flex:none}
.sp{display:grid;grid-template-columns:78px 1fr 64px;gap:8px;align-items:center;font-size:12px}
.sp b{color:var(--frost);font-size:12px;letter-spacing:.04em}
.sp .cb{height:13px;background:#070505;border:1px solid #000;box-shadow:0 0 0 1px #3a2f25;position:relative;overflow:hidden}
.sp .cb i{position:absolute;left:0;top:0;bottom:0;transition:width .3s}
.sp .cb s{position:absolute;top:0;bottom:0;width:1px;background:#0009}
.sp .v{font-family:var(--pix);font-size:11px;text-align:right}
.sp.full .cb{box-shadow:0 0 0 1px #d8b56c,0 0 8px #d8b56c88}
.sp.lurk .cb{box-shadow:0 0 0 1px #ff5a3a,0 0 10px #ff5a3a;animation:pulse .8s infinite alternate}
.sp .tag{grid-column:1/-1;margin-top:-3px;font-size:10px;color:#ff8a6a;letter-spacing:.08em;display:none}
.sp.lurk .tag{display:block}
@keyframes pulse{to{box-shadow:0 0 0 1px #ff5a3a,0 0 2px #ff5a3a}}
#ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;flex:none}
.ab{font-family:var(--serif);font-weight:700;letter-spacing:.12em;font-size:12px;color:#e6d3a8;padding:11px 4px;cursor:pointer;
  background:linear-gradient(180deg,#2a221b,#16110e);border:2px solid #050403;box-shadow:inset 0 0 0 1px #6b5226,0 2px 5px #000a;border-radius:3px}
.ab:active{transform:translateY(1px)}
.ab.on{color:#fff;background:linear-gradient(180deg,#5a1010,#2a0505)}
#tabs{display:flex;gap:4px;flex:none}
#tabs button{flex:1;font-family:var(--serif);font-size:11px;letter-spacing:.15em;padding:7px 2px;color:#8f826b;background:#120e0c;border:1px solid #3a2f25;border-bottom:none;cursor:pointer}
#tabs button.on{color:var(--gold);background:#1f1915}
#pane{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px;border-top:none}
.pg{display:none}.pg.on{display:block}
#log{font-family:var(--pix);font-size:11.5px;line-height:1.45}
#log div{padding:1px 0;border-bottom:1px solid #ffffff08}
#log .h{color:var(--frost)} #log .m{color:#e8a08a} #log .c{color:#ffd27a;font-weight:700} #log .k{color:#ff8a6a} #log .t{color:#6b5f4c;margin-top:4px}
#log .x{color:#9be0ff}
h3{font-size:11px;letter-spacing:.22em;color:var(--gold);margin:10px 0 5px;display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#A8844688,transparent)}
h3:first-child{margin-top:2px}
.sl{display:grid;grid-template-columns:1fr 54px;gap:2px 8px;align-items:center;font-size:12px;margin:5px 0}
.sl input{grid-column:1/-1;width:100%;accent-color:#a88446}
.sl span{font-family:var(--pix);text-align:right;color:var(--frost)}
.tg{display:flex;gap:9px;align-items:flex-start;font-size:12px;padding:6px 0;cursor:pointer}
.tg input{margin-top:2px;width:17px;height:17px;accent-color:#a88446;flex:none}
.tg small{display:block;color:#8f826b;font-size:11px;font-family:Georgia,serif}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px}
.stats span:nth-child(even){font-family:var(--pix);color:var(--frost);text-align:right}
.note{font-size:11.5px;color:#8f826b;font-family:Georgia,serif;margin:6px 0;line-height:1.4}
#ov{position:fixed;inset:0;z-index:5;background:#000c;display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
#ov .panel{padding:18px 18px 14px;max-width:380px;width:100%}
#ov h2{text-align:center;font-size:22px;letter-spacing:.15em;margin-bottom:10px;color:#e0c890;text-shadow:0 0 14px #8A0303}
#ov.win h2{color:var(--frost);text-shadow:0 0 14px #38BDF8}
#ov .ab{width:100%;margin-top:12px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="panel hp" id="h0"><div class="name">Eiskönigin</div><div class="bar"><i></i></div><div class="hpnum"><span class="n"></span><span class="st">BETÄUBT</span></div></div>
    <div class="panel" id="mid">ZUG<b id="turnN">0</b></div>
    <div class="panel hp" id="h1"><div class="name">Abgrund-Dämon</div><div class="bar"><i></i></div><div class="hpnum"><span class="n"></span><span class="st">BETÄUBT</span></div></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="chainMsg"></div></div>
  <div class="panel" id="spells"></div>
  <div id="ctl">
    <button class="ab" id="bNew">NEU</button>
    <button class="ab" id="bStep">ZUG ▸</button>
    <button class="ab" id="bAuto">AUTO</button>
  </div>
  <div id="tabs"><button data-p="pLog" class="on">KAMPFLOG</button><button data-p="pSet">REGLER</button><button data-p="pSim">SIMULATION</button></div>
  <div class="panel" id="pane">
    <div class="pg on" id="pLog"><div id="log"></div></div>
    <div class="pg" id="pSet"></div>
    <div class="pg" id="pSim">
      <p class="note">Spielt viele Kämpfe sofort mit den aktuellen Reglern durch und zeigt die Durchschnittswerte.</p>
      <div class="sl"><label>Anzahl Kämpfe</label><span id="simNv">1000</span><input type="range" id="simN" min="100" max="5000" step="100" value="1000"></div>
      <button class="ab" id="bSim" style="width:100%">SIMULIEREN</button>
      <div id="simOut" style="margin-top:10px"></div>
    </div>
  </div>
</div>
<div id="ov"><div class="panel"><h2 id="ovT"></h2><div class="stats" id="ovS"></div><button class="ab" id="ovB">NEUER KAMPF</button></div></div>

/* ================= KAMPFLOGIK (rein, für Spiel und Simulation) ================= */
function newFight(){
  return {turn:0,hero:{hp:C.heroHp,stunned:false},mon:{hp:C.monHp,stun:0,skipped:false},
    ch:{fb:0,nova:0,met:0},wait:0,lurking:false,lurkLost:false,over:null,
    chain:null,chains:[],dmgTotal:0,dmgChain:0,metCasts:0,maxPerTurn:0,multiTurns:0,heroTurns:0,ev:[]};
}
function finalizeChain(F){ if(F.chain&&F.chain.links.length>=2) F.chains.push(F.chain); F.chain=null; }
function link(F,label,dmg,starter){
  if(starter){ finalizeChain(F); F.chain={links:[label],last:F.turn,dmg:0}; return; }
  if(!F.chain) return false;
  if(C.gapOn&&F.turn-F.chain.last>C.gapMax){ finalizeChain(F); return false; }
  F.chain.links.push(label); F.chain.last=F.turn; F.chain.dmg+=dmg; F.dmgChain+=dmg; return true;
}
const targetStunned=F=>F.mon.stun>0||F.mon.skipped;
// ein Zauber (oder Hieb) – liefert Event
function cast(F,k,o){
  const stunned=targetStunned(F);
  let p=k==="hit"?100:pct(k), lab=k==="hit"?"Hieb":SP[k].name, tags=[];
  if(k==="met"&&o.bonus){p*=1+C.lurkBonus/100;tags.push("Lauern");}
  if(o.quake){p=C.metPct*C.quakePct/100;lab="Nachbeben";}
  let crit=Math.random()*100<C.crit;
  if(k==="fb"&&C.meltOn&&stunned){crit=true;tags.push("Schmelzen");}
  let dmg=Math.round(C.heroAtk*p/100*(crit?C.critMult/100:1));
  F.mon.hp=Math.max(0,F.mon.hp-dmg); F.dmgTotal+=dmg;
  if(k!=="hit"){ // Ladung
    if(o.trig&&C.brakeC) F.ch[k]=0; else if(!o.quake) F.ch[k]-=cd(k);
  }
  if(k==="met"){F.metCasts++; if(!o.quake){F.lurking=false;F.wait=0;F.lurkLost=false;}}
  const e={who:0,k,lab,dmg,crit,tags,trig:!!o.trig,stun:false,resist:false};
  if(k==="nova"&&C.stunT>0){ if(C.bossImmune) e.resist=true; else {F.mon.stun=C.stunT;e.stun=true;} }
  // Kettenbuchhaltung
  const chainName=lab+(crit?" (Krit)":"")+(tags.includes("Lauern")?" ⌛":"");
  const crTrig=k==="met"&&crit&&!o.quake&&(C.quakeOn||C.glutOn);
  if(k==="nova"&&e.stun) link(F,"Nova",dmg,true);
  else if(k!=="hit"&&(o.trig||tags.length)){ if(!link(F,chainName,dmg,false)&&crTrig) link(F,chainName,0,true); }
  else if(crTrig) link(F,chainName,0,true);
  e.chainLen=F.chain?F.chain.links.length:0;
  return e;
}
function heroTurn(F){
  F.turn++; F.heroTurns++;
  const out=[];
  if(F.hero.stunned){ F.hero.stunned=false;
    if(F.lurking){F.lurking=false;F.lurkLost=true;}
    if(F.chain) finalizeChain(F);
    out.push({who:0,skip:true}); F.mon.skipped=false; return out; }
  const rate=1+C.tempo/100;
  for(const k of ORDER) F.ch[k]+=rate;
  const stunned=targetStunned(F);
  // Hauptaktion bestimmen
  let main=null,bonus=false;
  for(const k of ORDER){
    if(F.ch[k]<cd(k)) continue;
    if(k==="met"&&C.lurkOn){
      if(stunned){bonus=true;}
      else if(!F.lurkLost&&F.wait<C.lurkMax){ F.wait++; F.lurking=true; continue; }
      else if(F.lurking) out.push({who:0,info:"Meteor wartet nicht länger."});
    }
    main=k;break;
  }
  const queue=[]; let casts=0, extras=0;
  const run=(k,o)=>{
    if(F.mon.hp<=0) return;
    const e=cast(F,k,o); out.push(e); if(k!=="hit")casts++;
    if(o.trig&&C.brakeA) return;
    if(k==="nova"&&C.vorboteOn&&e.dmg>=0){
      for(const j of ORDER) if(j!=="nova") F.ch[j]+=C.vorbote;
      if(C.vorbote>0) out.push({who:0,info:`Vorbote: Meteor & Feuerball +${C.vorbote}`});
      if(C.lurkOn&&e.stun&&F.ch.met>=cd("met")) queue.push(["met",{trig:true,bonus:true}]);
    }
    if(k==="met"&&e.crit){
      if(C.quakeOn) queue.push(["met",{trig:true,quake:true}]);
      if(C.glutOn){ F.ch.fb=Math.max(F.ch.fb,cd("fb")); queue.push(["fb",{trig:true}]); }
    }
  };
  run(main||"hit",{bonus});
  let guard=0;
  while(queue.length&&F.mon.hp>0&&guard++<50){
    if(C.brakeB&&extras>=1){ const r=queue.shift(); out.push({who:0,info:`Bremse b: ${r[1].quake?"Nachbeben":SP[r[0]].name} entfällt.`}); continue; }
    const [k,o]=queue.shift(); extras++; run(k,o);
  }
  F.maxPerTurn=Math.max(F.maxPerTurn,casts); if(casts>=2)F.multiTurns++;
  F.mon.skipped=false;
  if(F.mon.hp<=0){F.over="win";finalizeChain(F);}
  return out;
}
function monTurn(F){
  const out=[];
  if(F.mon.stun>0){F.mon.stun--;F.mon.skipped=true;out.push({who:1,skip:true});return out;}
  const dmg=Math.round(C.monAtk*(0.8+Math.random()*0.4));
  F.hero.hp=Math.max(0,F.hero.hp-dmg);
  const e={who:1,lab:"Klaue",dmg,stunHero:false};
  if(C.heroStunOn&&Math.random()*100<C.heroStunCh&&F.hero.hp>0){F.hero.stunned=true;e.stunHero=true;}
  out.push(e);
  if(F.hero.hp<=0){F.over="loss";finalizeChain(F);}
  return out;
}
function summary(F){
  const longest=F.chains.reduce((m,c)=>Math.max(m,c.links.length),0);
  return {longest,count:F.chains.length,share:F.dmgTotal?F.dmgChain/F.dmgTotal:0};
}
function simulate(n){
  let a={win:0,turns:0,met:0,metCasts:0,longest:0,longMax:0,chains:0,share:0,maxPT:0,multi:0,heroTurns:0,metNever:0};
  for(let i=0;i<n;i++){const F=newFight();let g=0;
    while(!F.over&&g++<200){heroTurn(F);if(F.over)break;monTurn(F);}
    const s=summary(F);a.win+=F.over==="win";a.turns+=F.turn;a.met+=F.metCasts>0;a.metCasts+=F.metCasts;
    a.longest+=s.longest;a.longMax=Math.max(a.longMax,s.longest);a.chains+=s.count;a.share+=s.share;
    a.maxPT=Math.max(a.maxPT,F.maxPerTurn);a.multi+=F.multiTurns;a.heroTurns+=F.heroTurns;}
  return a;
}

/* ================= DARSTELLUNG ================= */
const $=q=>document.querySelector(q);
const cv=$("#cv"),cx=cv.getContext("2d");
const img={};
for(const k of ["queen","demon"]){const im=new Image();im.onload=()=>img[k]=im;im.src="data:image/png;base64,"+ART[k];}
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(3,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR|0;cv.height=H*DPR|0;}
window.addEventListener("resize",resize);
const fx=[]; const floats=[]; const lunge=[0,0]; const shake={t:0};
function addFloat(side,txt,col,big){floats.push({side,txt,col,big,t:0});}
function pos(side){return {x:side?W*0.73:W*0.27,y:H*0.80};}
function draw(time){
  cx.setTransform(DPR,0,0,DPR,0,0);cx.imageSmoothingEnabled=false;
  const sx=shake.t>0?(Math.random()-.5)*shake.t*14:0; shake.t=Math.max(0,shake.t-0.03);
  cx.clearRect(0,0,W,H); cx.save(); cx.translate(sx,0);
  // Boden & Wand
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0c0908");g.addColorStop(.62,"#1b1411");g.addColorStop(.63,"#2a211c");g.addColorStop(1,"#0d0a09");
  cx.fillStyle=g;cx.fillRect(-20,0,W+40,H);
  cx.strokeStyle="#00000088";cx.lineWidth=1;
  for(let i=0;i<9;i++){const y=H*.63+i*i*2.2;cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}
  for(let i=-6;i<=6;i++){cx.beginPath();cx.moveTo(W/2+i*W*.06,H*.63);cx.lineTo(W/2+i*W*.22,H);cx.stroke();}
  // Fackeln
  for(const x of [W*.08,W*.92]){const f=.8+Math.sin(time/90+x)*.15;const rg=cx.createRadialGradient(x,H*.3,0,x,H*.3,H*.5*f);
    rg.addColorStop(0,"#ff9a3a33");rg.addColorStop(1,"#0000");cx.fillStyle=rg;cx.fillRect(0,0,W,H);
    cx.fillStyle="#ffcf6a";cx.fillRect(x-2,H*.27-6*f,4,8*f);cx.fillStyle="#3a2a1a";cx.fillRect(x-1.5,H*.3,3,H*.12);}
  // Figuren
  const ph=H*0.62;
  for(const side of [0,1]){
    const im=img[side?"demon":"queen"]; if(!im)continue;
    const p=pos(side), sc=Math.max(1,Math.floor(ph/im.height*1.0*DPR)/DPR);
    const w=im.width*sc,h=im.height*sc, l=lunge[side]; lunge[side]*=0.86;
    const st=side?(Fight&&Fight.mon.stun>0):(Fight&&Fight.hero.stunned);
    cx.fillStyle="#0008";cx.beginPath();cx.ellipse(p.x,p.y,w*.38,h*.06,0,0,7);cx.fill();
    cx.save();cx.translate(p.x+(side?-l:l)*W*.12,p.y+Math.sin(time/500+side*2)*1.5);
    if(!side)cx.scale(-1,1); // Bild schaut nach links → Heldin spiegeln
    cx.drawImage(im,-w/2,-h,w,h);cx.restore();
    if(st){cx.strokeStyle="#9be0ff";cx.lineWidth=2;for(let i=0;i<3;i++){const a=time/300+i*2.1;cx.beginPath();cx.arc(p.x+Math.cos(a)*14,p.y-h-6+Math.sin(a)*4,3,0,7);cx.stroke();}}
  }
  // Effekte
  for(let i=fx.length-1;i>=0;i--){const e=fx[i];e.t+=1/40;const t=e.t;if(t>1){fx.splice(i,1);continue;}
    const a=pos(0),b=pos(1),ty=b.y-H*.32;
    if(e.k==="fb"){const x=a.x+(b.x-a.x)*Math.min(1,t*1.6),y=a.y-H*.35+Math.sin(Math.min(1,t*1.6)*Math.PI)*-20;
      if(t<.62){cx.fillStyle="#ff7a2a";cx.beginPath();cx.arc(x,y,7,0,7);cx.fill();cx.fillStyle="#ffe08a";cx.beginPath();cx.arc(x,y,3.5,0,7);cx.fill();}
      else{cx.fillStyle=`rgba(255,120,40,${1-t})`;cx.beginPath();cx.arc(b.x,ty,40*(t-.5),0,7);cx.fill();}}
    if(e.k==="nova"){cx.strokeStyle=`rgba(160,230,255,${1-t})`;cx.lineWidth=4;cx.beginPath();cx.ellipse(b.x,b.y-H*.2,W*.25*t,H*.18*t,0,0,7);cx.stroke();
      cx.fillStyle=`rgba(200,240,255,${(1-t)*.25})`;cx.fill();}
    if(e.k==="met"){const tt=Math.min(1,t*1.8);const x=b.x+60*(1-tt),y=-20+(ty+20)*tt;
      if(t<.55){cx.fillStyle=e.q?"#ff9a5a":"#ff3a1a";cx.beginPath();cx.arc(x,y,e.q?8:13,0,7);cx.fill();cx.strokeStyle="#ff9a3a88";cx.lineWidth=6;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+30,y-50);cx.stroke();}
      else{cx.fillStyle=`rgba(255,80,20,${1-t})`;cx.beginPath();cx.arc(b.x,b.y-H*.15,(e.q?50:80)*(t-.4),0,7);cx.fill();}}
    if(e.k==="hit"||e.k==="claw"){const p=e.k==="hit"?b:a;cx.strokeStyle=`rgba(${e.k==="hit"?"220,240,255":"255,90,70"},${1-t})`;cx.lineWidth=3;
      for(let j=0;j<3;j++){cx.beginPath();cx.moveTo(p.x-18+j*9,p.y-H*.42);cx.lineTo(p.x-6+j*9,p.y-H*.22);cx.stroke();}}
  }
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=1/60;if(f.t>1.3){floats.splice(i,1);continue;}
    const p=pos(f.side);cx.globalAlpha=Math.min(1,1.6-f.t);cx.font=`700 ${f.big?22:15}px ${getComputedStyle(document.body).fontFamily}`;
    cx.textAlign="center";cx.lineWidth=4;cx.strokeStyle="#000";const y=p.y-H*.66-f.t*28+(f.off||0);
    cx.strokeText(f.txt,p.x,y);cx.fillStyle=f.col;cx.fillText(f.txt,p.x,y);cx.globalAlpha=1;}
  cx.restore();
  requestAnimationFrame(draw);
}

/* ================= UI ================= */
let Fight=null, auto=false, busy=false, timer=null, logEl=$("#log");
function log(html,cls){const d=document.createElement("div");d.className=cls||"";d.innerHTML=html;logEl.appendChild(d);
  const pane=$("#pane");if($("#pLog").classList.contains("on"))pane.scrollTop=pane.scrollHeight;}
function buildSpells(){const box=$("#spells");box.innerHTML="";
  for(const k of ORDER){const d=document.createElement("div");d.className="sp";d.id="sp_"+k;
    d.innerHTML=`<b>${SP[k].name}</b><div class="cb"><i style="background:${SP[k].col}"></i></div><span class="v"></span><span class="tag">⌛ LAUERT – wartet auf Betäubung</span>`;box.appendChild(d);} }
function hud(){
  if(!Fight)return;
  $("#h0 .bar i").style.transform=`scaleX(${Fight.hero.hp/C.heroHp})`;$("#h0 .n").textContent=`${Fight.hero.hp}/${C.heroHp}`;
  $("#h1 .bar i").style.transform=`scaleX(${Fight.mon.hp/C.monHp})`;$("#h1 .n").textContent=`${Fight.mon.hp}/${C.monHp}`;
  $("#h0 .st").classList.toggle("on",Fight.hero.stunned);$("#h1 .st").classList.toggle("on",Fight.mon.stun>0);
  $("#h1 .name").textContent="Abgrund-Dämon"+(C.bossImmune?" (immun)":"");
  $("#turnN").textContent=Fight.turn;
  for(const k of ORDER){const el=$("#sp_"+k),c=Fight.ch[k],m=cd(k);
    el.querySelector("i").style.width=Math.min(100,c/m*100)+"%";
    el.querySelector(".v").textContent=`${(+c.toFixed(1))}/${m}`;
    el.classList.toggle("full",c>=m);el.classList.toggle("lurk",k==="met"&&Fight.lurking);
    const cb=el.querySelector(".cb");cb.querySelectorAll("s").forEach(s=>s.remove());
    for(let i=1;i<m;i++){const s=document.createElement("s");s.style.left=(i/m*100)+"%";cb.appendChild(s);} }
}
function newGame(){Fight=newFight();logEl.innerHTML="";floats.length=0;fx.length=0;$("#ov").className="";
  log("Ein neuer Kampf beginnt. Die Eiskönigin handelt zuerst.","t");hud();}
const wait=ms=>new Promise(r=>setTimeout(r,auto?ms*.55:ms));
async function play(events){
  for(const e of events){
    if(e.info){log("· "+e.info,"t");continue;}
    if(e.skip){log(e.who?"Der Dämon ist betäubt und setzt aus.":"Die Eiskönigin ist betäubt und setzt aus.",e.who?"x":"k");
      addFloat(e.who,"BETÄUBT","#9be0ff");hud();await wait(500);continue;}
    if(e.who===1){lunge[1]=1;fx.push({k:"claw",t:0});Sound.hit(false);
      addFloat(0,"-"+e.dmg,"#ff6a5a");shake.t=.3;
      log(`Dämon: Klaue → ${e.dmg} Schaden${e.stunHero?" · <b>Heldin betäubt!</b>":""}`,"m");hud();await wait(600);continue;}
    lunge[0]=e.k==="hit"?1:0.35;fx.push({k:e.k,t:0,q:e.lab==="Nachbeben"});Sound[e.k==="hit"?"hit":e.k](e.crit);
    await wait(e.k==="hit"?180:380);
    addFloat(1,(e.crit?"KRIT ":"")+"-"+e.dmg,e.crit?"#ffd27a":"#fff",e.crit||e.k==="met");if(e.crit||e.k==="met")shake.t=.5;
    let t=`${e.trig?"↳ ":""}${e.lab}${e.crit?" <b>KRIT</b>":""}${e.tags.length?" ["+e.tags.join(", ")+"]":""} → ${e.dmg}`;
    if(e.stun)t+=" · betäubt";if(e.resist)t+=" · <b>widersteht der Betäubung</b>";
    log(t,e.trig?"c":"h");hud();await wait(e.k==="hit"?380:650);
  }
}
function chainText(c){return "Kette: "+c.links.join(" → ");}
let shownChains=0;
async function step(){
  if(busy||!Fight)return; if(Fight.over){newGame();return;} busy=true;
  log(`— Zug ${Fight.turn+1} —`,"t");
  const prevChain=Fight.chain?Fight.chain.links.length:0;
  await play(heroTurn(Fight));
  if(Fight.chain&&Fight.chain.links.length>=2&&Fight.chain.links.length>prevChain){
    const m=$("#chainMsg");m.textContent=chainText(Fight.chain);m.classList.add("on");clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove("on"),2200);
    log(chainText(Fight.chain),"c");Sound.chain(Fight.chain.links.length);}
  if(!Fight.over){await wait(250);await play(monTurn(Fight));}
  hud(); busy=false;
  if(Fight.over) end();
  else if(auto) timer=setTimeout(step,450);
}
function end(){auto=false;$("#bAuto").classList.remove("on");
  const s=summary(Fight);const ov=$("#ov");ov.className="on "+(Fight.over==="win"?"win":"");
  $("#ovT").textContent=Fight.over==="win"?"SIEG":"NIEDERLAGE";
  const rows=[["Züge der Heldin",Fight.heroTurns],["Meteor gewirkt",Fight.metCasts?Fight.metCasts+"×":"nie"],
    ["Ketten (ab 2 Gliedern)",s.count],["Längste Kette",s.longest||"–"],["Anteil Kettenschaden",Math.round(s.share*100)+" %"],
    ["Max. Zauber in einem Zug",Fight.maxPerTurn],["Gesamtschaden",Fight.dmgTotal]];
  $("#ovS").innerHTML=rows.map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join("")+
    (Fight.chains.length?`<span style="grid-column:1/-1;font-size:11px;color:#ffd27a;margin-top:6px">${Fight.chains.map(chainText).join("<br>")}</span>`:"");
  Fight.chains.forEach(c=>log(chainText(c)+` (+${c.dmg} Schaden)`,"c"));
}
// Regler
function buildSettings(){const p=$("#pSet");p.innerHTML=`<p class="note">Änderungen gelten ab dem nächsten Zug und werden im Browser gespeichert.</p>`;
  for(const [grp,list] of TOGGLES){p.insertAdjacentHTML("beforeend",`<h3>${grp}</h3>`);
    for(const [k,l,d] of list){const el=document.createElement("label");el.className="tg";
      el.innerHTML=`<input type="checkbox" ${C[k]?"checked":""}><span>${l}<small>${d}</small></span>`;
      el.querySelector("input").onchange=e=>{C[k]=e.target.checked;save();hud();};p.appendChild(el);}}
  for(const [grp,list] of SLIDERS){p.insertAdjacentHTML("beforeend",`<h3>${grp}</h3>`);
    for(const [k,l,mn,mx,st,u] of list){const el=document.createElement("div");el.className="sl";
      el.innerHTML=`<label>${l}</label><span>${C[k]}${u}</span><input type="range" min="${mn}" max="${mx}" step="${st}" value="${C[k]}">`;
      el.querySelector("input").oninput=e=>{C[k]=+e.target.value;el.querySelector("span").textContent=C[k]+u;save();hud();};p.appendChild(el);}}
  const r=document.createElement("button");r.className="ab";r.style.cssText="width:100%;margin-top:12px";r.textContent="STANDARDWERTE";
  r.onclick=()=>{C={...DEF};save();buildSettings();hud();};p.appendChild(r);}
$("#simN").oninput=e=>$("#simNv").textContent=e.target.value;
$("#bSim").onclick=()=>{const n=+$("#simN").value,a=simulate(n),pc=x=>Math.round(x*100)+" %";
  const rows=[["Siege",pc(a.win/n)],["Ø Züge pro Kampf",(a.turns/n).toFixed(1)],["Meteor wirkt mind. 1×",pc(a.met/n)],["Ø Meteore pro Kampf",(a.metCasts/n).toFixed(2)],
   ["Ø Ketten pro Kampf",(a.chains/n).toFixed(2)],["Ø längste Kette",(a.longest/n).toFixed(2)],["Längste Kette insgesamt",a.longMax],
   ["Ø Anteil Kettenschaden",pc(a.share/n)],["Züge mit ≥ 2 Zaubern",pc(a.multi/a.heroTurns)],["Max. Zauber in einem Zug",a.maxPT]];
  $("#simOut").innerHTML=`<div class="stats">${rows.map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join("")}</div>`;};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tabs button,.pg").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("#"+b.dataset.p).classList.add("on");});
$("#bNew").onclick=()=>{Sound.unlock();clearTimeout(timer);auto=false;$("#bAuto").classList.remove("on");busy=false;newGame();};
$("#bStep").onclick=()=>{Sound.unlock();step();};
$("#bAuto").onclick=()=>{Sound.unlock();auto=!auto;$("#bAuto").classList.toggle("on",auto);if(auto&&!busy){if(Fight.over)newGame();step();}};
$("#ovB").onclick=()=>{newGame();};

/* ================= TON ================= */
const Sound={ctx:null,unlock(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();},
  tone(f,d,type,v,slide){const c=this.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,c.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+d);g.gain.setValueAtTime(v||.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);},
  noise(d,v,f){const c=this.ctx;if(!c)return;const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);
    const s=c.createBufferSource(),g=c.createGain(),fl=c.createBiquadFilter();fl.type="lowpass";fl.frequency.value=f||1200;s.buffer=b;g.gain.value=v||.15;s.connect(fl);fl.connect(g);g.connect(c.destination);s.start();},
  hit(cr){this.noise(.12,.12,1800);if(cr)this.tone(880,.15,"square",.05,1320);},
  fb(cr){this.noise(.35,.14,900);this.tone(200,.3,"sawtooth",.05,80);if(cr)this.tone(990,.2,"square",.05,1500);},
  nova(){this.tone(1400,.5,"triangle",.07,400);this.noise(.4,.08,4000);},
  met(cr){this.tone(120,.7,"sawtooth",.09,35);this.noise(.8,.25,500);if(cr)this.tone(660,.3,"square",.05,1320);},
  chain(n){for(let i=0;i<Math.min(n,6);i++)setTimeout(()=>this.tone(440*Math.pow(1.26,i),.12,"square",.05),i*70);}};

resize();buildSpells();buildSettings();newGame();requestAnimationFrame(draw);
</script>
