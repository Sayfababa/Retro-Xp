<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090707">
<title>Zauberkette</title>
<style>
:root{--bg:#090707;--gold:#A88446;--ice:#38BDF8;--frost:#D9F4FF;--text:#C8B99A;--blood:#8A0303;--fire:#ff8a3a;
  --serif:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif;--pix:"Courier New",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;width:100vw;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--serif);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;gap:6px;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px);
  background:radial-gradient(ellipse at 50% 30%,#1d1512 0%,#0d0a09 55%,#050404 100%)}
.panel{background:linear-gradient(180deg,#1f1915,#120e0c);border:2px solid #050403;border-radius:3px;position:relative;
  box-shadow:inset 0 0 0 1px #4a3d2f,inset 0 0 0 3px #0b0807,inset 0 0 0 4px #2a221b,0 3px 8px #000a}
.panel::before,.panel::after{content:"";position:absolute;width:6px;height:6px;top:3px;left:3px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#d8b56c,#6b5226 60%,#1a1209);box-shadow:0 0 0 1px #000}
.panel::after{left:auto;right:3px}
/* HUD */
#hud{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;flex:none}
.hp{padding:7px 9px 6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.name{font-size:11px;font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #000}
#hH .name{color:var(--frost)} #hE .name{color:#e8a08a}
.bar{height:10px;background:#070505;border:1px solid #000;box-shadow:0 0 0 1px #3a2f25;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .3s}
.bar u{position:absolute;top:0;bottom:0;right:0;background:#bfe6ff;opacity:.85;transition:width .3s}
#hH .bar i{background:repeating-linear-gradient(90deg,#1b6fa8 0 3px,#2384c4 3px 4px)}
#hE .bar i{background:repeating-linear-gradient(90deg,#7a0303 0 3px,#930606 3px 4px)}
.hpnum{font-family:var(--pix);font-size:11px;font-weight:700}
#mid{padding:6px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:9px;letter-spacing:.18em;color:var(--gold)}
#mid b{font-size:14px;color:var(--frost);letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;align-content:flex-start;gap:3px;height:32px;overflow:hidden}
.chip{font-family:var(--pix);font-size:10px;font-weight:700;padding:0 4px;border:1px solid;line-height:13px;white-space:nowrap}
.c-chill{color:#bfe9ff;border-color:#38BDF8;background:#0e3550}
.c-frozen{color:#062033;border-color:#d9f4ff;background:#9be0ff}
.c-burn{color:#ffd0a0;border-color:#ff7a2a;background:#4a1a05}
.c-brit{color:#fff2b0;border-color:#e0c060;background:#3a3010}
.c-vuln{color:#ffc0c0;border-color:#e04040;background:#3a0a0a}
.c-shield{color:#e6f6ff;border-color:#9fb8c8;background:#25313a}
.c-rage{color:#ff9a7a;border-color:#a03020;background:#2a0805}
.c-aff{color:#e8b0ff;border-color:#8a50b0;background:#24102e}
.c-imm{color:#9be0ff;border-color:#4a7a90;background:#0c1a22}
/* Bühne */
#stage{position:relative;flex:1 1 auto;min-height:120px}
#cv{position:absolute;inset:0;width:100%;height:100%}
/* Ketten */
#chains{padding:7px 8px;flex:none;display:grid;grid-template-columns:44px repeat(4,1fr);gap:4px 5px;align-items:center}
#chains .lab{font-size:8.5px;letter-spacing:.12em;text-align:right;line-height:1.15}
.slot{position:relative;height:50px;border:1px solid #3a2f25;background:#0d0a09;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:2px;transition:transform .15s}
.slot svg{width:28px;height:28px}
.slot span{font-size:8.5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.slot em{position:absolute;top:1px;right:3px;font-style:normal;font-family:var(--pix);font-size:10px;font-weight:700}
.rbar{grid-column:2/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;height:14px}
.rbar i{font-style:normal;background:#1a1410;border:1px solid #3a2f25;font-size:8px;letter-spacing:.08em;color:#120e0c;display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-weight:700}
.rbar i.done{background:#3a2f25}
.rbar i.now{background:linear-gradient(90deg,#a88446,#ffd24a,#a88446);border-color:#ffd24a;box-shadow:0 0 10px #ffd24a88}
.slot.e{border-color:#5a1a14;background:#150807}
.slot.e em{color:#ff8a6a}
.slot.heavy{box-shadow:inset 0 0 0 1px #ff5a3a}
.slot.heavy::after{content:"⚠";position:absolute;top:0;left:3px;font-size:10px;color:#ff7a4a}
.slot.h{border-color:#1e4a66;background:#08121a}
.slot.cur{transform:translateY(-2px);box-shadow:0 0 0 2px #d8b56c,0 0 12px #d8b56c99}
.slot.skip{opacity:.35}
.slot.skip::before{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:#9be0ff;transform:rotate(-20deg)}
#log{flex:0 0 74px;overflow-y:auto;font-family:var(--pix);font-size:11px;line-height:1.4;padding:6px 10px;-webkit-overflow-scrolling:touch}
#log div{border-bottom:1px solid #ffffff08}
#log .h{color:var(--frost)} #log .m{color:#e8a08a} #log .g{color:#ffd24a;font-weight:700} #log .t{color:#6b5f4c} #log .x{color:#9be0ff}
#ctl{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;flex:none}
.ab{font-family:var(--serif);font-weight:700;letter-spacing:.12em;font-size:12px;color:#e6d3a8;padding:11px 4px;cursor:pointer;
  background:linear-gradient(180deg,#2a221b,#16110e);border:2px solid #050403;box-shadow:inset 0 0 0 1px #6b5226,0 2px 5px #000a;border-radius:3px}
.ab:active{transform:translateY(1px)}
.ab.red{color:#fff;background:linear-gradient(180deg,#5a1010,#2a0505)}
.ab.ice{color:#fff;background:linear-gradient(180deg,#14466a,#082033);box-shadow:inset 0 0 0 1px #38BDF8,0 2px 5px #000a}
.ab:disabled{opacity:.4}
/* Overlays */
.ov{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;background:#070505f2;
  padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px)}
.ov.on{display:flex}
.ovIn{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
h2{font-size:18px;letter-spacing:.12em;text-align:center;color:#e0c890;text-shadow:0 0 14px #8A0303,0 2px 0 #000}
h3{font-size:10.5px;letter-spacing:.22em;color:var(--gold);display:flex;align-items:center;gap:8px;margin-top:4px}
h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#A8844688,transparent)}
.note{font-size:11.5px;color:#8f826b;font-family:Georgia,serif;line-height:1.4}
#foeCard{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
#foeCard .t{display:flex;justify-content:space-between;align-items:baseline}
#foeCard b{color:#e8a08a;font-size:15px;letter-spacing:.05em}
#foeCard .s{font-family:var(--pix);font-size:11px}
.pv{display:grid;grid-template-columns:44px repeat(4,1fr);gap:4px 5px;align-items:center;padding:8px}
.pv .lab{font-size:8.5px;letter-spacing:.12em;text-align:right}
.pv .slot.h{cursor:pointer}
.pv .slot.empty{border-style:dashed;color:#4a6a80}
.pv .vs{grid-column:2/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;font-size:9px;text-align:center;color:#8f826b;font-family:Georgia,serif;line-height:1.2}
.pv .vs .ok{color:#9be0ff}
#spGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sc{display:flex;flex-direction:column;gap:3px;padding:7px 8px;text-align:left;cursor:pointer;font-family:var(--serif);color:var(--text);
  background:linear-gradient(180deg,#1c1613,#100c0a);border:1px solid #3a2f25;border-radius:3px;position:relative}
.sc .top{display:flex;align-items:center;gap:6px}
.sc svg{width:26px;height:26px;flex:none}
.sc b{font-size:12px;color:var(--frost)}
.sc p{font-size:10.5px;font-family:Georgia,serif;line-height:1.3;color:#b3a68c}
.sc.in{border-color:#38BDF8;background:linear-gradient(180deg,#10283a,#08121a)}
.sc.in::after{content:attr(data-pos);position:absolute;top:4px;right:6px;font-family:var(--pix);font-weight:700;color:#38BDF8;font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:2px}
.tag{font-size:8.5px;padding:0 3px;letter-spacing:.04em;border:1px solid #4a3d2f;color:#a99a80}
.tag.kaelte{color:#9be0ff;border-color:#1e5a82}.tag.feuer{color:#ffb070;border-color:#8a3a10}
.tag.verb{color:#ffd24a;border-color:#7a6020}.tag.vorb{color:#b9f0c0;border-color:#2a6a3a}
.btnRow{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
/* Tree */
.tn{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;cursor:pointer;text-align:left;color:var(--text);font-family:var(--serif);
  background:linear-gradient(180deg,#1c1613,#100c0a);border:1px solid #3a2f25;border-radius:3px}
.tn b{font-size:12.5px;color:#e6d3a8}
.tn p{grid-column:1/-1;font-size:11px;font-family:Georgia,serif;color:#a99a80;line-height:1.3}
.tn .pips{display:flex;gap:3px;align-items:center}
.tn .pips i{width:9px;height:9px;transform:rotate(45deg);border:1px solid #6b5226;background:#120e0c}
.tn .pips i.on{background:#d8b56c;box-shadow:0 0 6px #d8b56c}
.tn.max{opacity:.75}
h3.g-ice{color:#7fd4ff}h3.g-ice::after{background:linear-gradient(90deg,#38BDF888,transparent)}
h3.g-fire{color:#ff9a4a}h3.g-fire::after{background:linear-gradient(90deg,#ff6a1a88,transparent)}
.tn.g-ice{border-color:#1e4a66;background:linear-gradient(180deg,#0e2030,#08121a)}.tn.g-ice b{color:#9be0ff}
.tn.g-ice .pips i{border-color:#2a6a90}.tn.g-ice .pips i.on{background:#38BDF8;box-shadow:0 0 6px #38BDF8}
.tn.g-fire{border-color:#6a2a10;background:linear-gradient(180deg,#2a140a,#140806)}.tn.g-fire b{color:#ffb070}
.tn.g-fire .pips i{border-color:#8a3a10}.tn.g-fire .pips i.on{background:#ff7a2a;box-shadow:0 0 6px #ff7a2a}
.tn.arm{border-color:#d8b56c;box-shadow:0 0 0 1px #d8b56c,0 0 12px #d8b56c66}
#ptsBox{text-align:center;font-size:13px;letter-spacing:.1em}
#ptsBox b{color:#ffd24a;font-size:18px}
.sl{display:grid;grid-template-columns:1fr 60px;gap:2px 8px;align-items:center;font-size:12px}
.sl input{grid-column:1/-1;width:100%;accent-color:#a88446}
.sl span{font-family:var(--pix);text-align:right;color:var(--frost)}
#resBox{padding:16px;display:flex;flex-direction:column;gap:6px;margin:auto 0}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px}
.stats span:nth-child(even){font-family:var(--pix);color:var(--frost);text-align:right}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="panel hp" id="hH"><div class="name">Eiskönigin</div><div class="bar"><i></i><u></u></div><div class="hpnum"></div><div class="chips"></div></div>
    <div class="panel" id="mid"><span id="depthL">TIEFE 1</span><b id="fightL">1/4</b><span id="roundL">ZUG 0</span></div>
    <div class="panel hp" id="hE"><div class="name"></div><div class="bar"><i></i><u></u></div><div class="hpnum"></div><div class="chips"></div></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="panel" id="chains"></div>
  <div class="panel" id="log"></div>
  <div id="ctl">
    <button class="ab ice" id="bPlay">▶ KAMPF</button>
    <button class="ab" id="bSpeed">1×</button>
    <button class="ab" id="bSkip">ENDE ⏭</button>
  </div>
</div>

<!-- Vorbereitung -->
<div class="ov" id="prep"><div class="ovIn">
  <h2 id="prepT">Vorbereitung</h2>
  <div class="scroll">
    <div class="panel" id="foeCard"></div>
    <div class="panel pv" id="pv"></div>
    <h3>Zauber – antippen zum Einsetzen</h3>
    <div id="spGrid"></div>
  </div>
  <div class="btnRow"><button class="ab" id="bTree">SKILL TREE</button><button class="ab" id="bSet">REGLER</button></div>
  <button class="ab red" id="bGo">KAMPF BEGINNEN</button>
</div></div>

<!-- Skill Tree -->
<div class="ov" id="tree"><div class="ovIn">
  <h2>Skill Tree</h2>
  <div id="ptsBox"></div>
  <p class="note" style="text-align:center">Punkte sind dauerhaft. Antippen markiert, nochmal antippen bestätigt.</p>
  <div class="scroll" id="treeList"></div>
  <div class="btnRow"><button class="ab" id="bTreeR">ZURÜCKSETZEN</button><button class="ab" id="bTreeX">ZURÜCK</button></div>
</div></div>

<!-- Regler -->
<div class="ov" id="set"><div class="ovIn">
  <h2>Regler</h2>
  <div class="scroll" id="setList"></div>
  <button class="ab" id="bSetX">ZURÜCK</button>
</div></div>

<!-- Ergebnis -->
<div class="ov" id="res"><div class="ovIn"><div class="panel" id="resBox"></div></div></div>

  if(o.el.includes("kaelte")&&F.foe.aff.includes("coldRes")&&!o.el.includes("feuer")) m*=1-C.resist/100;
  if(e.vuln>0) m*=1+C.vuln/100;

    else{abs=Math.min(e.shield,dmg);e.shield-=abs;dmg-=abs;} }
  e.hp=Math.max(0,e.hp-dmg); F.stats.dmg+=dmg; if(crit)F.stats.crits++; F.stats.maxHit=Math.max(F.stats.maxHit,dmg);

  if(crit&&T("schwung")) F.momentum=0.25*T("schwung");

function burnRemaining(F){let s=F.e.burn,t=0,per=C.burnDmg+T("schwel");while(s>0){t+=s*per;s--;}return t;}
function castSpell(F,id){
  const S=SPELLS[id], tg=S.tags, el=tg.filter(x=>x==="kaelte"||x==="feuer"), e=F.e;
  F.spellMult=1+(F.momentum||0); if(F.momentum)E(F,{t:"info",txt:`Schwung: +${Math.round(F.momentum*100)} %`}); F.momentum=0;
  if(tg.includes("verb")) F.spellMult*=1+0.2*T("gier");

                    if(tg.includes("einschlag")&&T("hall")) {E(F,{t:"info",txt:"Nachhall!"});H(p*0.25*T("hall"),{lab:"Nachhall"});}

   case "blizzard": F.dots.push({id,left:3+T("klang")}); E(F,{t:"info",txt:"Blizzard tobt."}); break;
   case "embers": F.dots.push({id,left:3+T("klang")}); E(F,{t:"info",txt:"Glutregen fällt."}); break;

function tickDots(F){

function enemyTurn(F){
  F.ev=[]; const slot=F.round%4, st=F.foe.steps[slot], e=F.e, h=F.h;
  E(F,{t:"turn",who:1,slot});
  if(e.burn>0){const d=e.burn*(C.burnDmg+T("schwel"))*(F.foe.aff.includes("fireRes")?1-C.resist/100:1);const dd=Math.max(1,Math.round(d));
    e.hp=Math.max(0,e.hp-dd);F.stats.dmg+=dd;E(F,{t:"hit",dmg:dd,col:"burn",lab:"Brand",small:1,crit:false,abs:0});e.burn--;
    if(e.hp<=0){F.over="win";E(F,{t:"end"});return F.ev;}}
  if(e.frozen){e.frozen=false;e.imm=C.freezeImm;F.skipped.push(F.round);F.stats.skips++;E(F,{t:"skip",slot,step:st});}
  else{
    if(e.imm>0)e.imm--;
    const enr=F.round+1>=C.roundCap?2:1; if(enr===2&&F.round+1===C.roundCap)E(F,{t:"info",txt:"RASEREI! Der Gegner macht doppelten Schaden."});
    E(F,{t:"act",step:st});
    if(st.dmg){let d=Math.round(st.dmg*(1+e.rage/100)*enr),abs=0;
      if(h.shield>0){abs=Math.min(h.shield,d);h.shield-=abs;d-=abs;

    if(st.shield){e.shield+=st.shield;E(F,{t:"info",txt:`${st.n}: Schild ${st.shield}.`});}
    if(st.rage){e.rage+=st.rage;E(F,{t:"info",txt:`${st.n}: +${st.rage} % Schaden.`});}

  }
  if(e.vuln>0)e.vuln--;
  F.round++;
  if(h.hp<=0){F.over="loss";E(F,{t:"end"});}
  else if(F.round>=C.roundCap+10){F.over="loss";E(F,{t:"info",txt:"Die Heldin bricht erschöpft zusammen."});E(F,{t:"end"});}

  mk("SKILL TREE ZURÜCKSETZEN",()=>{P.pts+=Object.values(P.tree).reduce((a,b)=>a+b,0);P.tree={};});
  mk("REGLER: STANDARD",()=>{C={...DEF};});
  mk("ALLES ZURÜCKSETZEN",()=>{C={...DEF};P={depth:1,pts:0,earned:0,tree:{},chain:["nova","grip","shatter","meteor"]};run.idx=0;});
}
$("#bSet").onclick=()=>{drawSet();$("#set").classList.add("on");};
$("#bSetX").onclick=()=>{$("#set").classList.remove("on");openPrep();};

/* Ton */
const Sound={ctx:null,unlock(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();},
  tone(f,d,type,v,slide){const c=this.ctx;if(!c||skipAll)return;const o=c.createOscillator(),g=c.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,c.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+d);g.gain.setValueAtTime(v||.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);},
  noise(d,v,f){const c=this.ctx;if(!c||skipAll)return;const b=c.createBuffer(1,c.sampleRate*d|0,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);
    const s=c.createBufferSource(),g=c.createGain(),fl=c.createBiquadFilter();fl.type="lowpass";fl.frequency.value=f||1200;s.buffer=b;g.gain.value=v||.12;s.connect(fl);fl.connect(g);g.connect(c.destination);s.start();},
  cast(id){const fire=SPELLS[id].tags.includes("feuer"),imp=SPELLS[id].tags.includes("einschlag");
    if(imp){this.tone(120,.6,"sawtooth",.08,40);this.noise(.6,.2,500);}else if(fire){this.noise(.3,.12,900);this.tone(220,.25,"sawtooth",.04,90);}else{this.tone(1300,.35,"triangle",.05,500);this.noise(.25,.05,4000);}},
  crit(){this.tone(880,.08,"square",.06,1320);setTimeout(()=>this.tone(1320,.15,"square",.05,1760),60);},
  freeze(){this.tone(2000,.4,"triangle",.05,800);},
  enemy(h){this.noise(h?.5:.15,h?.2:.1,h?600:1800);if(h)this.tone(90,.5,"sawtooth",.08,40);},
  click(){this.tone(600,.04,"square",.03);}};

resize();requestAnimationFrame(drawFrame);openPrep();
</script>
