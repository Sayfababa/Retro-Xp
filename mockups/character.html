<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#008080">
<title>Retro-XP Charakter</title>
<style>
  :root {
    --face: #c0c0c0; --hi: #ffffff; --lo: #808080; --dk: #000000;
    --title: #000080; --title2: #1084d0; --desk: #008080;
    --hp: #a00000; --xp: #000080;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: var(--desk);
    font-family: "MS Sans Serif", Tahoma, Geneva, Verdana, sans-serif; font-size: 14px;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* Fenster füllt den Bildschirm im Hochformat */
  .win {
    height: 100dvh; max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    max-width: 480px; margin: 0 auto;
    background: var(--face); padding: 3px; display: flex; flex-direction: column;
    border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
    box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 var(--lo);
  }
  .titlebar {
    background: linear-gradient(90deg, var(--title), var(--title2));
    color: #fff; font-weight: bold; padding: 4px 4px 4px 6px; flex: none;
    display: flex; justify-content: space-between; align-items: center;
  }
  .tb-btns { display: flex; gap: 2px; }
  .tb-btns span {
    width: 22px; height: 20px; background: var(--face); color: #000;
    display: grid; place-items: center; font-size: 12px; font-weight: bold;
    border: 1px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
  }
  .body { flex: 1; min-height: 0; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .sunken {
    border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
    box-shadow: inset 1px 1px 0 var(--dk);
  }
  fieldset {
    margin: 0; padding: 8px 6px 6px; border: 1px solid var(--lo); min-width: 0;
    box-shadow: 1px 1px 0 var(--hi), inset 1px 1px 0 var(--hi);
  }
  legend { padding: 0 3px; }

  /* Kopf: Portrait oben links */
  .head { flex: none; display: grid; grid-template-columns: 88px 1fr; gap: 8px; }
  .portrait { width: 88px; height: 88px; background: #2a2a40; display: grid; place-items: center; }
  .portrait svg { width: 72px; height: 72px; }
  .nameline { display: flex; justify-content: space-between; align-items: baseline; }
  .name { font-size: 17px; font-weight: bold; }
  .lvl { font-weight: bold; }
  .barrow { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 4px; margin-top: 6px; }
  .bar { height: 22px; background: #fff; position: relative; }
  .fill { height: 100%; }
  .bar b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: normal; font-size: 12px; color: #000; text-shadow: 0 0 2px #fff, 0 0 2px #fff; }
  .hp .fill { background: var(--hp); width: 72%; }
  .xp { background: var(--face); padding: 2px; display: flex; gap: 2px; }
  .xp i { flex: 1; background: var(--xp); }
  .xp i.off { background: transparent; }

  /* Attribute: 4 nebeneinander, spart Höhe */
  .stats { flex: none; }
  .statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .stat .k { font-weight: bold; font-size: 12px; }
  .stat .v { background: #fff; width: 100%; text-align: center; padding: 3px 0; font-size: 15px; }
  .statfoot { margin-top: 5px; font-size: 12px; color: #333; text-align: right; }

  /* Inventar nimmt restliche Höhe, scrollt bei Bedarf */
  .invbox { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .invscroll { flex: 1; min-height: 0; overflow-y: auto; background: #a8a8a8; padding: 3px; -webkit-overflow-scrolling: touch; }
  .inv { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
  .slot { aspect-ratio: 1; background: #b8b8b8; display: grid; place-items: center; font-size: 24px; }
  .slot.sel { outline: 2px dotted #000; outline-offset: -4px; }
  .invinfo { display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px; color: #333; }

  /* Buttons (min. 44px Touch-Ziel) */
  .btn {
    background: var(--face); font: inherit; color: #000; padding: 0; cursor: pointer; border-radius: 0;
    -webkit-appearance: none; appearance: none;
    border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
    box-shadow: inset -1px -1px 0 var(--lo), inset 1px 1px 0 #dfdfdf;
  }
  .btn:active { border-color: var(--dk) var(--hi) var(--hi) var(--dk); box-shadow: inset 1px 1px 0 var(--lo); }
  .plus { width: 100%; height: 30px; font-weight: bold; font-size: 16px; }
  .bar6 { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .bar6 .btn { height: 44px; }
  .status { flex: none; display: flex; gap: 3px; font-size: 12px; }
  .status div { flex: 1; padding: 3px 5px; }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar"><span>🗡 Charakter.exe</span><div class="tb-btns"><span>?</span><span>✕</span></div></div>
  <div class="body">

    <div class="head">
      <div class="portrait sunken">
        <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
          <rect x="4" y="2" width="8" height="3" fill="#6b3f1f"/>
          <rect x="4" y="5" width="8" height="6" fill="#e0b090"/>
          <rect x="5" y="7" width="2" height="1" fill="#000"/><rect x="9" y="7" width="2" height="1" fill="#000"/>
          <rect x="6" y="9" width="4" height="1" fill="#8a4a3a"/>
          <rect x="3" y="11" width="10" height="5" fill="#3050a0"/>
          <rect x="7" y="11" width="2" height="5" fill="#c0c0c0"/>
        </svg>
      </div>
      <div>
        <div class="nameline"><span class="name">Aldric</span><span class="lvl">Lvl 7</span></div>
        <div class="barrow"><span>HP</span><div class="bar sunken hp"><div class="fill"></div><b>72 / 100</b></div></div>
        <div class="barrow"><span>XP</span><div class="bar sunken xp">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i><i class="off"></i></div></div>
      </div>
    </div>

    <fieldset class="stats">
      <legend>Attribute</legend>
      <div class="statgrid">
        <div class="stat"><span class="k">STR</span><span class="v sunken">14</span><button class="btn plus">+</button></div>
        <div class="stat"><span class="k">DEX</span><span class="v sunken">11</span><button class="btn plus">+</button></div>
        <div class="stat"><span class="k">INT</span><span class="v sunken">8</span><button class="btn plus">+</button></div>
        <div class="stat"><span class="k">VIT</span><span class="v sunken">12</span><button class="btn plus">+</button></div>
      </div>
      <div class="statfoot">Freie Punkte: 3</div>
    </fieldset>

    <fieldset class="invbox">
      <legend>Inventar</legend>
      <div class="invscroll sunken"><div class="inv" id="inv"></div></div>
      <div class="invinfo"><span>Gold: 245</span><span>12 / 30</span></div>
    </fieldset>

    <div class="bar6">
      <button class="btn">Knopf 1</button><button class="btn">Knopf 2</button><button class="btn">Knopf 3</button>
      <button class="btn">Knopf 4</button><button class="btn">Knopf 5</button><button class="btn">Knopf 6</button>
    </div>

    <div class="status"><div class="sunken">Bereit</div><div class="sunken">Tag 1, 08:00</div></div>
  </div>
</div>
<script>
  const items = ["🗡","🛡","🧪","🧪","🍞","🗝","📜","💍","🏹","🪙","🦴","🧭"];
  const inv = document.getElementById("inv");
  for (let i = 0; i < 30; i++) {
    const s = document.createElement("div");
    s.className = "slot sunken";
    s.textContent = items[i] || "";
    s.onclick = () => { inv.querySelectorAll(".sel").forEach(e => e.classList.remove("sel")); s.classList.add("sel"); };
    inv.appendChild(s);
  }
</script>
</body>
</html>
