<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Retro-XP Charakter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* Win95-Aufbau, Diablo-1-Farben: Stein, Rost, Blut, mattes Gold */
  :root {
    --bg: #050403;
    --face: #241d16; --face2: #2e251c;
    --hi: #6b5a43; --mid: #3d3226; --lo: #120e0a; --dk: #000;
    --gold: #c9b27a; --gold-dim: #8c7a4f; --text: #b8a988;
    --title: #2a0000; --title2: #6e0d0d;
    --hp: #8a0000; --hp2: #c41a1a; --xp: #6d5a20; --xp2: #a8892e;
    --well: #0e0b08;
    --class: rgba(90,150,255,.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #1a0c06 0%, var(--bg) 70%);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif; font-size: 14px;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .gothic { font-family: "Cinzel", Georgia, serif; letter-spacing: .04em; }

  .win {
    height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    max-width: 480px; margin: 0 auto; padding: 3px;
    display: flex; flex-direction: column;
    background: var(--face);
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px);
    border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
    box-shadow: inset 1px 1px 0 var(--mid), inset -1px -1px 0 var(--lo);
  }
  .titlebar {
    background: linear-gradient(90deg, var(--title), var(--title2) 70%, #3a0505);
    color: var(--gold); padding: 4px 4px 4px 8px; flex: none;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #000; text-shadow: 1px 1px 0 #000;
  }
  .titlebar .gothic { font-weight: 800; font-size: 14px; }
  .tb-btns { display: flex; gap: 2px; }
  .tb-btns span {
    width: 22px; height: 20px; background: var(--face2); color: var(--gold);
    display: grid; place-items: center; font-size: 12px; font-weight: bold;
    border: 1px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
  }

  .body { flex: 1; min-height: 0; padding: 8px 8px 0; display: flex; flex-direction: column; gap: 7px; }
  .sunken {
    border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
    box-shadow: inset 1px 1px 0 var(--dk);
  }
  fieldset {
    margin: 0; padding: 7px 6px 6px; min-width: 0;
    border: 1px solid var(--lo); box-shadow: 1px 1px 0 var(--mid), inset 1px 1px 0 var(--mid);
  }
  legend { padding: 0 4px; color: var(--gold); font-family: "Cinzel", Georgia, serif; font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }

  /* Kopf */
  .head { flex: none; display: grid; grid-template-columns: 104px 1fr; gap: 8px; }
  .portrait { width: 104px; height: 104px; background: #0a0705; }
  .portrait img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .portrait { box-shadow: inset 1px 1px 0 #000, 0 0 10px var(--class); }
  .nameline { display: flex; justify-content: space-between; align-items: baseline; }
  .name { font-size: 18px; font-weight: 800; color: var(--gold); text-shadow: 1px 1px 0 #000; }
  .lvl { color: var(--gold-dim); font-size: 13px; }
  .cls { font-size: 12px; color: var(--gold-dim); font-style: italic; margin-top: -2px; }
  .barrow { display: grid; grid-template-columns: 24px 1fr; align-items: center; gap: 4px; margin-top: 5px; }
  .barrow > span { font-size: 12px; color: var(--gold-dim); }
  .bar { height: 20px; background: var(--well); position: relative; }
  .fill { height: 100%; }
  .bar b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: normal; font-size: 12px; color: #f0e4c4; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; }
  .hp .fill { width: 72%; background: linear-gradient(180deg, var(--hp2), var(--hp) 60%, #4a0000); }
  .xp { padding: 2px; display: flex; gap: 2px; }
  .xp i { flex: 1; background: linear-gradient(180deg, var(--xp2), var(--xp)); }
  .xp i.off { background: #1a140e; }

  /* Mitte: Attribute links, Ausrüstung rechts */
  .mid { flex: none; display: grid; grid-template-columns: 128px 1fr; gap: 7px; }
  .stat { display: grid; grid-template-columns: 1fr 32px 30px; align-items: center; gap: 3px; margin-bottom: 4px; }
  .stat .k { font-family: "Cinzel", Georgia, serif; font-weight: 600; font-size: 12px; color: var(--gold); }
  .stat .v { background: var(--well); text-align: center; padding: 3px 0; font-size: 14px; color: #f0e4c4; }
  .statfoot { font-size: 11px; color: var(--gold-dim); text-align: right; margin-top: 2px; }
  .statfoot b { color: #d84a2a; }

  .equip { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 38px); gap: 3px; position: relative; }
  .equip::before { /* Silhouette im Hintergrund */
    content: ""; position: absolute; inset: 0; margin: auto; width: 34%; pointer-events: none;
    background: radial-gradient(circle at 50% 12%, #2a2118 0 12%, transparent 13%),
                linear-gradient(#2a2118, #2a2118) 50% 32% / 70% 34% no-repeat,
                linear-gradient(#2a2118, #2a2118) 32% 88% / 22% 32% no-repeat,
                linear-gradient(#2a2118, #2a2118) 68% 88% / 22% 32% no-repeat;
    opacity: .7;
  }
  .eq { background: var(--well); display: grid; place-items: center; font-size: 19px; position: relative; z-index: 1; }
  .eq.empty::after { content: attr(data-l); font-size: 9px; color: #5a4b37; font-family: Georgia, serif; text-transform: uppercase; letter-spacing: .05em; }
  .eq.sel, .slot.sel { outline: 1px solid var(--gold); outline-offset: -3px; }
  .c1 { grid-column: 1; } .c2 { grid-column: 2; } .c3 { grid-column: 3; }

  /* Inventar */
  .invbox { flex: 1; min-height: 90px; display: flex; flex-direction: column; }
  .invscroll { flex: 1; min-height: 0; overflow-y: auto; background: var(--well); padding: 3px; -webkit-overflow-scrolling: touch; }
  .inv { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
  .slot { aspect-ratio: 1; background: #17120d; display: grid; place-items: center; font-size: 20px; border: 1px solid #000; box-shadow: inset 1px 1px 0 #2a2118; }
  .invinfo { display: flex; justify-content: space-between; margin-top: 4px; font-size: 12px; }
  .gold { color: #e0c060; }

  /* Buttonleiste: 6 nebeneinander, unten am Rand */
  .btn {
    background: var(--face2); font: inherit; color: var(--gold); padding: 0; cursor: pointer; border-radius: 0;
    -webkit-appearance: none; appearance: none;
    border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
    box-shadow: inset -1px -1px 0 var(--lo), inset 1px 1px 0 var(--mid);
  }
  .btn:active { border-color: var(--dk) var(--hi) var(--hi) var(--dk); box-shadow: inset 1px 1px 0 var(--lo); background: #1a140f; }
  .plus { width: 30px; height: 26px; font-weight: bold; font-size: 15px; }
  .plus:disabled { color: #4a3d2c; }
  .taskbar {
    flex: none; display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px;
    padding: 5px 5px 4px; margin: 6px -3px -3px; background: #16110c;
    border-top: 2px solid var(--hi); box-shadow: inset 0 1px 0 var(--mid);
  }
  .taskbar .btn { height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .taskbar .ico { font-size: 20px; line-height: 1; filter: sepia(.6) saturate(.8); }
  .taskbar .lbl { font-size: 9px; letter-spacing: .03em; color: var(--gold-dim); }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar"><span class="gothic">✠ Charakter</span><div class="tb-btns"><span>?</span><span>✕</span></div></div>
  <div class="body">

    <div class="head">
      <div class="portrait sunken">
        <img src="assets/mage_real.png" alt="Portrait">
      </div>
      <div>
        <div class="nameline"><span class="name gothic">Ysolde</span><span class="lvl gothic">Stufe 7</span></div>
        <div class="cls">Frostmagierin</div>
        <div class="barrow"><span>HP</span><div class="bar sunken hp"><div class="fill"></div><b>72 / 100</b></div></div>
        <div class="barrow"><span>XP</span><div class="bar sunken xp">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i><i class="off"></i></div></div>
      </div>
    </div>

    <div class="mid">
      <fieldset>
        <legend>Attribute</legend>
        <div class="stat"><span class="k">STR</span><span class="v sunken">14</span><button class="btn plus">+</button></div>
        <div class="stat"><span class="k">DEX</span><span class="v sunken">11</span><button class="btn plus">+</button></div>
        <div class="stat"><span class="k">INT</span><span class="v sunken">8</span><button class="btn plus">+</button></div>
        <div class="stat"><span class="k">VIT</span><span class="v sunken">12</span><button class="btn plus">+</button></div>
        <div class="statfoot">Frei: <b>3</b></div>
      </fieldset>

      <fieldset>
        <legend>Ausrüstung</legend>
        <div class="equip" id="equip">
          <div class="eq sunken c1 empty" data-l="Amulett"></div>
          <div class="eq sunken c2" data-l="Kopf">⛑</div>
          <div class="eq sunken c3 empty" data-l="Umhang"></div>
          <div class="eq sunken c1" data-l="Waffe">🗡</div>
          <div class="eq sunken c2" data-l="Brust">🥋</div>
          <div class="eq sunken c3" data-l="Schild">🛡</div>
          <div class="eq sunken c1 empty" data-l="Hände"></div>
          <div class="eq sunken c2" data-l="Gürtel">🎗</div>
          <div class="eq sunken c3" data-l="Ring">💍</div>
          <div class="eq sunken c1 empty" data-l="Ring"></div>
          <div class="eq sunken c2" data-l="Füße">🥾</div>
          <div class="eq sunken c3 empty" data-l="Gürtel+"></div>
        </div>
      </fieldset>
    </div>

    <fieldset class="invbox">
      <legend>Inventar</legend>
      <div class="invscroll sunken"><div class="inv" id="inv"></div></div>
      <div class="invinfo"><span class="gold">◉ 245 Gold</span><span>10 / 40</span></div>
    </fieldset>
  </div>

  <nav class="taskbar">
    <button class="btn"><span class="ico">⚔</span><span class="lbl">1</span></button>
    <button class="btn"><span class="ico">📜</span><span class="lbl">2</span></button>
    <button class="btn"><span class="ico">✨</span><span class="lbl">3</span></button>
    <button class="btn"><span class="ico">🗺</span><span class="lbl">4</span></button>
    <button class="btn"><span class="ico">📖</span><span class="lbl">5</span></button>
    <button class="btn"><span class="ico">⚙</span><span class="lbl">6</span></button>
  </nav>
</div>
<script>
  const items = ["🧪","🧪","🧪","🍞","🗝","📜","🏹","🦴","🧭","💎"];
  const inv = document.getElementById("inv");
  for (let i = 0; i < 40; i++) {
    const s = document.createElement("div");
    s.className = "slot";
    s.textContent = items[i] || "";
    inv.appendChild(s);
  }
  const select = e => {
    const t = e.target.closest(".slot, .eq");
    if (!t) return;
    document.querySelectorAll(".sel").forEach(x => x.classList.remove("sel"));
    t.classList.add("sel");
  };
  inv.onclick = select;
  document.getElementById("equip").onclick = select;
</script>
</body>
</html>
